# =============================================================================
# Open-GIS project template — open-gis-project/v1
# -----------------------------------------------------------------------------
# Copy this file to project.yaml and fill every field relevant to YOUR task.
# Delete sections that do not apply, but keep project.yaml as the canonical
# manifest for any material multi-stage analysis.
#
# The STRUCTURE below is schema-valid as shipped: a fresh copy passes
# `manifest.json_schema`. The CONTENT is deliberately not — `open-gis validate
# --preflight` on an unedited copy reports the TODO values you still owe it.
# That is the intended starting state, not a defect.
#
# See references/project-spec.md for the full schema and semantics.
# =============================================================================

schema: open-gis-project/v1

project:
  id: TODO-project-id
  title: TODO-human-readable-title
  question: >-
    TODO the original (or restated) user question being answered.
  created_at: 2026-08-25T00:00:00Z
  updated_at: 2026-08-25T00:00:00Z
  status: draft              # draft | in_progress | validated | warning | failed

interpretation:
  objective: >-
    TODO analyst interpretation of the objective in one or two sentences.
  assumptions:
    - id: A1
      statement: >-
        TODO the assumption made ("near" = <= N meters, etc.).
      rationale: >-
        TODO why this interpretation was chosen.

sources:
  # One block per source dataset. See project-spec.md section 2.2.
  example_source:
    role: authoritative_input      # authoritative_input | context | reference
    provider: TODO-provider
    dataset: TODO-dataset-name
    source_url: https://...
    portal_page: https://...      # human landing page, when it differs
    access:
      method: WFS                 # WFS | WMS | STAC | http(s) | api | s3 | local
      retrieved_at: 2026-08-25T00:00:00Z
      downloaded_at: 2026-08-25T00:00:00Z   # when the bytes were actually pulled
      file:                       # what landed on disk, exactly
        name: TODO                # or archive_name / extracted_file for archives
        table_name: TODO          # layer or table bound inside the file
        format: TODO
        row_count: TODO
        column_count: TODO
      request_spec: >-            # the exact query/bbox/params used to fetch
        TODO
    version:
      published_at: 2026-08-24
      identifier: TODO            # release tag, STAC item id, layer/table id
    selection:
      bbox: [west, south, east, north]
      filter: TODO
      semantic_predicates:
        - field: TODO                 # e.g. ownership_code
          domain_value: TODO          # e.g. 1 = municipal, from source metadata
      completeness:                   # required for bounded APIs
        matched: TODO                 # service-declared total
        returned: TODO                # rows materialized after pagination
        page_size: TODO
        pages: TODO
    license:
      name: TODO
      url: https://...
    schema:                       # the shape you actually received
      crs: TODO                   # e.g. EPSG:3301 (L-EST97)
      key: TODO                   # stable feature identifier
      columns:
        - id
        - geometry
    rationale: >-
      TODO why this source over alternatives.

overrides: []
  # List of analyst/user corrections and additions stored as data, never
  # silently mutating the sources. See project-spec.md section 2.3.

processing:
  analysis_crs: EPSG:2154            # metric CRS (Estonia: EPSG:3301 / L-EST97)
  storage_crs: EPSG:4326             # storage/interchange CRS
  # Ordered, deterministic steps, each with operation, input/output, explicit
  # crs, parameters, and thresholds.
  # The graph must resolve: every input symbol is a sources.* key or an
  # earlier step's output, spelled exactly as the producer declared it.
  steps:
    - id: load_example
      operation: read
      source: example_source
      output: example_raw
    # - id: select_candidates
    #   operation: filter
    #   input: example_raw
    #   expression: "area_m2 >= 20000"
    #   output: candidates

outputs:
  # Each output: path, format, generated_by: <step id>.
  example_output:
    path: data/derived/example.parquet
    format: GeoParquet
    generated_by: load_example
    # role: exploratory_companion    # optional; mark anything that is NOT the
    # note: >-                       # accepted result, and say why
    #   TODO

validation:
  # Flat identifiers only (no `no_duplicate: field` mappings) — each name must
  # appear verbatim as a checks[].id in validation/latest-report.json.
  # Trim what does not apply; keep the provenance and parity gates.
  required:
    - geometry_valid
    - crs_known
    - row_count_gt_zero
    - no_duplicate_cadastral_id       # <check>_<field>, rename per your key
    - no_null_cadastral_id
    - source_semantics_verified       # decision-critical classes are authoritative
    - source_result_complete          # matched == returned after pagination
    - overrides_applied               # every override has an application result
    - manifest_graph_resolves         # every step input/output symbol resolves
    - view_controls_match_pipeline    # presentation.controls canonical == run
    - qgis_project_static_valid       # IDs, files, styles, CRS
    - manifest_report_parity          # manifest, report, and run record agree
  domain_checks:
    - name: example_range_check
      expression: "TODO sql-like predicate"

presentation:
  intent: analytical_workspace      # analytical_workspace | discovery | report
  primary_view: map
  layout:
    type: map_with_sidebar         # map | map_with_sidebar | full_map | report
    sidebar:
      position: left
      width: medium
      organization: tabs           # tabs | stacked
      section_state: collapsible   # collapsible | static
      tabs:
        - id: analysis
          title: Analysis
          sections: [summary, metrics, criteria, assumptions, warnings]
        - id: map
          title: Map
          sections: [scenario_controls, filters, layer_controls, basemap]
        - id: edit
          title: Edit
          sections: [selected_feature, draw_geometry, draft_overrides, export_bundle]
        - id: provenance
          title: Provenance
          sections: [provenance, overrides, validation, outputs, run_record]
  controls:                        # see presentation.yaml + project-spec.md s.3
    reconfigurable: true
    canonical_reset: true          # canonical position == the accepted run
    off_canonical_labelling: required
    filters: []                    # id, label, type, field(s), unit, canonical, step/options
    scenarios: []                  # id, override, canonical, baseline_fields
  map:
    engine_preference: maplibre    # maplibre | deck | kepler
    interaction:
      feature_select: true
      hover_tooltip: true
      zoom_to_selection: true
    layer_groups:
      - id: analysis
        title: Analysis
        default_open: true
      - id: user_overrides
        title: Manual additions and corrections
        default_open: true
    layers:
      # One entry per rendered dataset. semantic_role is a closed vocabulary
      # (project-spec.md section 3); never substitute agent-chosen hex colors.
      - source: example_output
        group: analysis
        semantic_role: primary_result
        geometry: polygon          # point | line | polygon | raster
        style:
          visual_priority: primary
          opacity: 0.65
  legend:
    visible: true
    mode: semantic
  provenance_ui:
    feature_source_on_click: true
    show_source_timestamp: true
    show_override_badge: true
    show_assumptions: true
  editing:
    allow_draw_geometry: true
    allow_attribute_override: true
    allow_hide_source_feature: true
    allow_add_annotation: true
    draft_persistence: local_storage       # local_storage | none
    export_format: open-gis-override-bundle/v1
    canonical_application: pipeline_required
    targets: {}                            # keyed rendered collection; each target
      # candidates:                        # declares source, stable id/label fields,
      #   label: Candidate feature         # and editable field mappings:
      #   source: example_source           # [{view_field, source_field, label, type,
      #   id_field: feature_id             #   options?, source_value_field?}]
      #   label_field: name
      #   fields: []

warnings: []
  # Known unresolved data-quality limits, surfaced in UX. See section 2.8.

runtime:
  implementation:
    preferred_engine: duckdb-spatial
    pipeline: pipeline.py
    # Optional for Conda, containers, SQL, or another launcher. It is parsed
    # without a shell; a YAML list avoids quoting ambiguity:
    # command: [conda, run, -n, open-gis, python, pipeline.py]
    # Project-local files a clean run needs; each must exist in the project:
    # dependencies:
    #   - requirements.lock
    #   - config/analysis.toml
  environment:
    python: "3.13"
    duckdb: TODO
    gdal: TODO
    proj: TODO

runs:
  latest:
    id: TODO-run-YYYYMMDD-HHMMSS
    started_at: TODO
    completed_at: TODO
    status: passed             # passed | warning | failed
    # Canonical file-set hashes over the run's real input and output
    # inventories — not hashes of manifest prose. See project-spec.md s.2.8.
    inputs_hash: "sha256:TODO"
    outputs_hash: "sha256:TODO"
    record:
      path: runs/TODO-run-YYYYMMDD-HHMMSS.json
    validation_report:
      path: validation/latest-report.json
