name: OpenMapStack live agent benchmark

# Live benchmarks are scheduled/manual and deliberately non-blocking for PRs.
# Each matrix leg gets only its own credential and retains the complete audit
# bundle produced by evals/run.py.
on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent adapter(s) to run"
        required: true
        default: both
        type: choice
        options: [both, claude_code, codex, openai_compatible]
      claude_model:
        description: "Exact Claude model id (falls back to CLAUDE_BENCHMARK_MODEL variable)"
        required: false
      codex_model:
        description: "Exact Codex model id (falls back to CODEX_BENCHMARK_MODEL variable)"
        required: false
      openai_model:
        description: "Exact OpenAI-compatible model id (falls back to OPENAI_COMPATIBLE_BENCHMARK_MODEL variable)"
        required: false
      repetitions:
        description: "Trials per selected agent/case (use 5 for published comparisons)"
        required: false
        default: "3"
      timeout:
        description: "Per-agent timeout in seconds"
        required: false
        default: "1200"
      seed:
        description: "Optional base seed recorded for the run"
        required: false
      cases:
        description: "Space-separated case ids to run (default: every case that declares live mode)"
        required: false
      arms:
        description: "Benchmark arm(s): oms (skill injected), plain (no skill), or paired (both over identical cases, trials, and seeds)"
        required: false
        default: oms
        type: choice
        options: [oms, plain, paired]
      price_catalog_date:
        description: "YYYY-MM-DD of the price list behind the cost estimates (recorded in arm provenance)"
        required: false
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

jobs:
  live-benchmark:
    name: live benchmark (${{ matrix.agent }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        agent: [claude_code, codex, openai_compatible]
    steps:
      - name: Select requested adapter
        id: selection
        env:
          REQUESTED_AGENT: ${{ github.event.inputs.agent || 'both' }}
          MATRIX_AGENT: ${{ matrix.agent }}
        run: |
          if [[ "$REQUESTED_AGENT" == "both" || "$REQUESTED_AGENT" == "$MATRIX_AGENT" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.selection.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.selection.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install eval dependencies
        if: steps.selection.outputs.run == 'true'
        run: pip install -r evals/requirements.txt

      - name: Prepare controlled DuckDB Spatial directory
        if: steps.selection.outputs.run == 'true'
        run: |
          echo "OPENMAPSTACK_SPATIAL_EXTENSION_DIR=${RUNNER_TEMP}/openmapstack-duckdb-extensions" >> "$GITHUB_ENV"
          OPENMAPSTACK_SPATIAL_EXTENSION_DIR="${RUNNER_TEMP}/openmapstack-duckdb-extensions" python evals/prepare_spatial.py

      - name: Install and verify agent CLI
        if: steps.selection.outputs.run == 'true'
        env:
          EVAL_AGENT: ${{ matrix.agent }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
        run: |
          case "$EVAL_AGENT" in
            claude_code)
              npm install --global @anthropic-ai/claude-code
              claude --version
              ;;
            codex)
              npm install --global @openai/codex
              codex --version
              ;;
            openai_compatible)
              # No CLI to install: the adapter talks to an OpenAI-compatible
              # HTTP endpoint configured entirely through the environment.
              if [[ -z "$OPENAI_COMPATIBLE_BASE_URL" || -z "$OPENAI_COMPATIBLE_API_KEY" ]]; then
                echo "openai_compatible requires the OPENAI_COMPATIBLE_BASE_URL variable and OPENAI_COMPATIBLE_API_KEY secret." >&2
                exit 2
              fi
              ;;
          esac

      - name: Run repeated live benchmark
        if: steps.selection.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ matrix.agent == 'claude_code' && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_CUSTOM_HEADERS: "anthropic-workspace-id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}"
          OPENAI_API_KEY: ${{ matrix.agent == 'codex' && secrets.OPENAI_API_KEY || '' }}
          EVAL_AGENT: ${{ matrix.agent }}
          CLAUDE_MODEL: ${{ github.event.inputs.claude_model || vars.CLAUDE_BENCHMARK_MODEL }}
          CODEX_MODEL: ${{ github.event.inputs.codex_model || vars.CODEX_BENCHMARK_MODEL }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: ${{ github.event.inputs.openai_model || vars.OPENAI_COMPATIBLE_BENCHMARK_MODEL }}
          EVAL_REPETITIONS: ${{ github.event.inputs.repetitions || '3' }}
          EVAL_TIMEOUT: ${{ github.event.inputs.timeout || '1200' }}
          EVAL_SEED: ${{ github.event.inputs.seed || '' }}
          EVAL_CASES: ${{ github.event.inputs.cases || '' }}
          EVAL_ARMS: ${{ github.event.inputs.arms || 'oms' }}
          EVAL_PRICE_CATALOG_DATE: ${{ github.event.inputs.price_catalog_date || '' }}
        run: |
          if [[ "$EVAL_AGENT" == "claude_code" ]]; then
            EVAL_MODEL="$CLAUDE_MODEL"
          elif [[ "$EVAL_AGENT" == "codex" ]]; then
            EVAL_MODEL="$CODEX_MODEL"
          else
            EVAL_MODEL="$OPENAI_COMPATIBLE_MODEL"
          fi
          if [[ -z "$EVAL_MODEL" ]]; then
            echo "An exact model id is required; set the workflow input or repository benchmark-model variable." >&2
            exit 2
          fi
          args=(
            --mode live
            --agent "$EVAL_AGENT"
            --model "$EVAL_MODEL"
            --arms "$EVAL_ARMS"
            --repetitions "$EVAL_REPETITIONS"
            --timeout "$EVAL_TIMEOUT"
            --json "eval-benchmark-results-$EVAL_AGENT.json"
          )
          if [[ -n "$EVAL_SEED" ]]; then args+=(--seed "$EVAL_SEED"); fi
          if [[ -n "$EVAL_PRICE_CATALOG_DATE" ]]; then args+=(--price-catalog-date "$EVAL_PRICE_CATALOG_DATE"); fi
          # No --case means every case that declares live mode. The list used
          # to be hardcoded to 001/002/004/005, which silently left the four
          # prompt-style cases (070-073, added by PR 8) running in no workflow
          # at all -- they are live-only, so fixture CI never touched them
          # either. A hardcoded list here cannot notice a new case; the runner
          # can, and it already exits 2 rather than publishing a green 0/0.
          for case in $EVAL_CASES; do args+=(--case "$case"); done
          python evals/run.py "${args[@]}"

      - name: Upload complete benchmark evidence
        if: always() && steps.selection.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-benchmark-${{ matrix.agent }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            eval-benchmark-results-${{ matrix.agent }}.json
            evals/results/**
