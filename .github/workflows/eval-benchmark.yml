name: Open-GIS live agent benchmark

# Manual/scheduled only. Live cases invoke real agent CLIs (Claude Code,
# Codex) against real prompts and must never block ordinary PRs — secrets
# and runtime cost are maintainer-owned. See evals/README.md.
on:
  workflow_dispatch:
    inputs:
      case:
        description: "Eval case id to run (omit for all live cases)"
        required: false
      agent:
        description: "Agent adapter: claude_code | codex"
        required: false
        default: claude_code
        type: choice
        options:
          - claude_code
          - codex
      model:
        description: "Optional model override passed to the selected agent"
        required: false
      repetitions:
        description: "Trials per selected case"
        required: false
        default: "3"
      timeout:
        description: "Per-agent timeout in seconds"
        required: false
        default: "1200"
      seed:
        description: "Optional base seed recorded for the run"
        required: false
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

jobs:
  live-benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true # a missing/rotated third-party credential must not fail the schedule
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval dependencies
        run: pip install -r evals/requirements.txt

      - name: Install and verify selected agent CLI
        env:
          EVAL_AGENT: ${{ github.event.inputs.agent || 'claude_code' }}
        run: |
          case "$EVAL_AGENT" in
            claude_code)
              npm install --global @anthropic-ai/claude-code
              command -v claude
              ;;
            codex)
              npm install --global @openai/codex
              command -v codex
              ;;
            *)
              echo "Unknown agent: $EVAL_AGENT" >&2
              exit 2
              ;;
          esac

      - name: Run live benchmark cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_AGENT: ${{ github.event.inputs.agent || 'claude_code' }}
          EVAL_CASE: ${{ github.event.inputs.case || '' }}
          EVAL_MODEL: ${{ github.event.inputs.model || '' }}
          EVAL_REPETITIONS: ${{ github.event.inputs.repetitions || '3' }}
          EVAL_TIMEOUT: ${{ github.event.inputs.timeout || '1200' }}
          EVAL_SEED: ${{ github.event.inputs.seed || '' }}
        run: |
          args=(
            --mode live
            --agent "$EVAL_AGENT"
            --repetitions "$EVAL_REPETITIONS"
            --timeout "$EVAL_TIMEOUT"
            --json eval-benchmark-results.json
          )
          if [[ -n "$EVAL_CASE" ]]; then args+=(--case "$EVAL_CASE"); fi
          if [[ -n "$EVAL_MODEL" ]]; then args+=(--model "$EVAL_MODEL"); fi
          if [[ -n "$EVAL_SEED" ]]; then args+=(--seed "$EVAL_SEED"); fi
          python evals/run.py "${args[@]}"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-benchmark-results
          path: eval-benchmark-results.json
