id: 911-mutated-source
case_type: mutation
modes: [fixture]
score_types: { fixture: mutation_tests }
project_dir: project
hard_gate: true
mutation:
  control_generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
fixture:
  generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir} --break=mutated_source"
  source_baseline:
    - { source: ../../fixtures/mini-tartu/parcels.geojson, destination: data/source/parcels.geojson }
    - { source: ../../fixtures/mini-tartu/roads.geojson, destination: data/source/roads.geojson }
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: data/source/pois.geojson }

assertions:
  - assert: project.conforms_to_schema
  - assert: validation.run_record_matches
  # A pipeline that rewrites its own copied "immutable" source after landing
  # it in data/source/ must be caught by a real pre/post byte comparison,
  # not merely by trusting whatever the manifest/report claims.
  - assert: overrides.source_files_byte_identical
    args:
      hashes_before: "$SOURCE_HASHES"
      paths:
        - data/source/pois.geojson
    expect: failed
    expect_code: source_mutated
