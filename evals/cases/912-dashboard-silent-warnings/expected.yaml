id: 912-dashboard-silent-warnings
case_type: mutation
modes: [visual]
score_types: { visual: mutation_tests }
project_dir: project
hard_gate: true
mutation:
  control_generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
visual:
  generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir} --break=dashboard_silent_warnings"
  source_baseline:
    - { source: ../../fixtures/mini-tartu/parcels.geojson, destination: data/source/parcels.geojson }
    - { source: ../../fixtures/mini-tartu/roads.geojson, destination: data/source/roads.geojson }
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: data/source/pois.geojson }

assertions:
  - assert: project.conforms_to_schema
  - assert: validation.run_record_matches
  - assert: qgis.static_valid
  - assert: qgis.styles_declared
  # The manifest declares a high-severity warning, but the dashboard renders
  # no warning panel: a product that hides a manifest claim must fail in the
  # browser, not merely in the manifest.
  - assert: visual.dashboard_loads_in_browser
    expect: failed
    expect_code: dashboard_visual_failure
    args: { screenshots_dir: "../visual/screenshots" }
