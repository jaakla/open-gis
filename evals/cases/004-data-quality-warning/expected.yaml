id: 004-data-quality-warning
case_type: positive
modes: [fixture, live]
score_types:
  fixture: contract_ci
  live: agent_benchmark
project_dir: project
hard_gate: true
fixture:
  generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir} --uncertain-completeness"
  source_baseline:
    - { source: ../../fixtures/mini-tartu/parcels.geojson, destination: data/source/parcels.geojson }
    - { source: ../../fixtures/mini-tartu/roads.geojson, destination: data/source/roads.geojson }
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: data/source/pois.geojson }
live:
  prompt_file: prompt.md
  agent_workdir: project
  fixtures:
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: project/data/source/pois.geojson }

assertions:
  - assert: project.status_is
    args: { status: warning }
  - assert: project.status_agrees_with_validation_report
  - assert: provenance.bounded_api_completeness
    args: { source: pois }
    expect: warning
  - assert: validation.warning_or_failed_propagates_to_status
  - assert: validation.no_implicit_pass
