id: 904-override-not-applied
case_type: mutation
modes: [fixture]
score_types: { fixture: mutation_tests }
project_dir: project
hard_gate: true
mutation:
  control_generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
fixture:
  generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir} --break=override_not_applied"
  source_baseline:
    - { source: ../../fixtures/mini-tartu/parcels.geojson, destination: data/source/parcels.geojson }
    - { source: ../../fixtures/mini-tartu/roads.geojson, destination: data/source/roads.geojson }
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: data/source/pois.geojson }

assertions:
  - assert: project.conforms_to_schema
  - assert: validation.run_record_matches
  # listing an override is not the same as applying it -- the actual output
  # data must be checked, not merely the report's claim.
  - assert: geodata.feature_field_equals
    args:
      path: data/derived/education_pois.geojson
      id_field: poi_id
      id: poi-7
      field: status
      equals: closed
    expect: failed
    expect_code: field_value_mismatch
