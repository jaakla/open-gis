id: 927-inline-credentials
case_type: mutation
modes: [fixture]
score_types: { fixture: mutation_tests }
project_dir: project
hard_gate: true
mutation:
  control_generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
fixture:
  generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir} --break=inline_credentials"
  source_baseline:
    - { source: ../../fixtures/mini-tartu/parcels.geojson, destination: data/source/parcels.geojson }
    - { source: ../../fixtures/mini-tartu/roads.geojson, destination: data/source/roads.geojson }
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: data/source/pois.geojson }

# Secrets never enter project.yaml. A credentialed DSN under access.connection
# is rejected even when everything else about the source is in order.
assertions:
  - assert: project.conforms_to_schema
  - assert: validation.run_record_matches
  - assert: provenance.every_source_pinned
  - assert: provenance.no_inline_credentials
    expect: failed
    expect_code: inline_credentials
