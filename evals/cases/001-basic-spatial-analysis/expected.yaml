id: 001-basic-spatial-analysis
case_type: positive
modes: [fixture, live]
score_types:
  fixture: contract_ci
  live: agent_benchmark
project_dir: project
hard_gate: true
fixture:
  generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
  source_baseline:
    - { source: ../../fixtures/mini-tartu/parcels.geojson, destination: data/source/parcels.geojson }
    - { source: ../../fixtures/mini-tartu/roads.geojson, destination: data/source/roads.geojson }
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: data/source/pois.geojson }
live:
  prompt_file: prompt.md
  agent_workdir: project
  fixtures:
    - { source: ../../fixtures/mini-tartu/parcels.geojson, destination: project/data/source/parcels.geojson }
    - { source: ../../fixtures/mini-tartu/roads.geojson, destination: project/data/source/roads.geojson }
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: project/data/source/pois.geojson }

assertions:
  - assert: project.schema_is
    args: { schema: open-gis-project/v1 }
  - assert: project.conforms_to_schema
  - assert: project.parses
  - assert: project.graph_resolves
  - assert: project.assumptions_have_rationale
  - assert: project.declared_files_exist
    args:
      files:
        - project.yaml
        - pipeline.py
        - project.qgz
        - validation/latest-report.json

  - assert: geodata.crs_not_used_for_metrics
  - assert: geodata.dataset_crs_is
    args: { path: data/derived/candidate-parcels.parquet, expected: "EPSG:3301" }
  - assert: geodata.row_count
    args: { path: data/derived/candidate-parcels.parquet, at_least: 1 }
  - assert: geodata.geometry_all_valid
    args: { path: data/derived/candidate-parcels.parquet }
  - assert: geodata.no_duplicate_ids
    args: { path: data/derived/candidate-parcels.parquet, id_field: cadastral_id }
  - assert: geodata.no_null_ids
    args: { path: data/derived/candidate-parcels.parquet, id_field: cadastral_id }
  # known geospatial truth: P1, P2, P5 qualify; P3 too far; P4 wrong land use
  - assert: geodata.feature_present
    args: { path: data/derived/candidate-parcels.parquet, id_field: cadastral_id, id: P1 }
  - assert: geodata.feature_present
    args: { path: data/derived/candidate-parcels.parquet, id_field: cadastral_id, id: P2 }
  - assert: geodata.feature_absent
    args: { path: data/derived/candidate-parcels.parquet, id_field: cadastral_id, id: P3 }
  - assert: geodata.feature_absent
    args: { path: data/derived/candidate-parcels.parquet, id_field: cadastral_id, id: P4 }
  - assert: geodata.row_count
    args: { path: data/derived/candidate-parcels.parquet, equals: 3 }

  - assert: validation.required_all_present
  - assert: validation.no_implicit_pass
  - assert: validation.run_record_matches
  - assert: validation.report_evidence_recomputes
    args:
      evidence:
        - { check_id: geometry_valid, evidence_field: features_checked, metric: row_count, path: data/derived/candidate-parcels.parquet }
        - { check_id: geometry_valid, evidence_field: invalid_count, metric: invalid_geometry_count, path: data/derived/candidate-parcels.parquet }
        - { check_id: no_duplicate_cadastral_id, evidence_field: duplicates, metric: duplicate_count, path: data/derived/candidate-parcels.parquet, field: cadastral_id }
        - { check_id: no_null_cadastral_id, evidence_field: nulls, metric: null_count, path: data/derived/candidate-parcels.parquet, field: cadastral_id }

  - assert: qgis.static_valid

  - assert: presentation.layers_use_semantic_roles

  - assert: overrides.source_files_byte_identical
    args:
      hashes_before: "$SOURCE_HASHES"
      paths:
        - data/source/parcels.geojson
        - data/source/roads.geojson
        - data/source/pois.geojson
