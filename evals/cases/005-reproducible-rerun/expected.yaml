id: 005-reproducible-rerun
mode: fixture
project_dir: project
hard_gate: true
generator: "python3 {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
rerun_generator: "python3 {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"

assertions:
  - assert: rerun.no_chat_dependency
  - assert: rerun.outputs_hash_stable
    args:
      rerun_workspace: "$RERUN"
      paths:
        - data/derived/candidate-parcels.parquet
        - data/derived/education_pois.geojson
  - assert: rerun.validation_report_reproducible
    args: { rerun_workspace: "$RERUN" }
  - assert: project.one_canonical_pipeline
    args: { wrapper_paths: [] }
