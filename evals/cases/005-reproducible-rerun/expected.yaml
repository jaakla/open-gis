id: 005-reproducible-rerun
case_type: positive
modes: [fixture, live]
score_types:
  fixture: contract_ci
  live: agent_benchmark
project_dir: project
hard_gate: true
fixture:
  generator: "python3 {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
  rerun_generator: "python3 {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
live:
  prompt_file: prompt.md
  agent_workdir: project
  # PR 3 replaces this oracle rerun with the generated project's canonical entrypoint.
  rerun_generator: "python3 {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
  fixtures:
    - { source: ../../fixtures/mini-tartu/parcels.geojson, destination: project/data/source/parcels.geojson }
    - { source: ../../fixtures/mini-tartu/roads.geojson, destination: project/data/source/roads.geojson }
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: project/data/source/pois.geojson }

assertions:
  - assert: rerun.no_chat_dependency
  - assert: rerun.outputs_hash_stable
    args:
      rerun_workspace: "$RERUN"
      paths:
        - data/derived/candidate-parcels.parquet
        - data/derived/education_pois.geojson
  - assert: rerun.validation_report_reproducible
    args: { rerun_workspace: "$RERUN" }
  - assert: project.one_canonical_pipeline
    args: { wrapper_paths: [] }
