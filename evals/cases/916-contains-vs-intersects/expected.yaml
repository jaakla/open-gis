    path: data/derived/candidates.parquet
    id_field: parcel_id
    id: P-A
  expect: failed
  expect_code: feature_missing
- assert: geodata.feature_present
  args:
    path: data/derived/candidates.parquet
    id_field: parcel_id
    id: P-B
- assert: geodata.feature_present
  args:
    path: data/derived/candidates.parquet
    id_field: parcel_id
    id: P-D
- assert: geodata.feature_absent
  args:
    path: data/derived/candidates.parquet
    id_field: parcel_id
