id: 002-attribute-override
case_type: positive
modes: [fixture, live]
score_types:
  fixture: contract_ci
  live: agent_benchmark
project_dir: project
hard_gate: true
fixture:
  generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
  source_baseline:
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: data/source/pois.geojson }
live:
  prompt_file: prompt.md
  agent_workdir: project
  fixtures:
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: project/data/source/pois.geojson }

assertions:
  - assert: overrides.declared_count
    args: { count: 1 }
  - assert: overrides.every_override_has_provenance
  - assert: overrides.evidence_not_placeholder
  - assert: overrides.from_value_matches_source
    args: { id: OVERRIDE-001, source_path: data/source/pois.geojson, id_field: poi_id }
  - assert: overrides.application_status
    args: { id: OVERRIDE-001, status: applied }
  - assert: geodata.feature_field_equals
    args:
      path: data/derived/education_pois.geojson
      id_field: poi_id
      id: poi-7
      field: status
      equals: closed
  # the immutable source must remain untouched
  - assert: geodata.feature_field_equals
    args:
      path: data/source/pois.geojson
      id_field: poi_id
      id: poi-7
      field: status
      equals: active
  - assert: validation.no_prose_only_validation
    args: { check_id: overrides_applied }
  - assert: overrides.source_files_byte_identical
    args:
      hashes_before: "$SOURCE_HASHES"
      paths:
        - data/source/pois.geojson
