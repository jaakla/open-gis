[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-gis-cli"
version = "0.1.0"
description = "Validate, run, and inspect reproducible Open-GIS projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4,<5", "PyYAML>=6,<7"]

[project.scripts]
open-gis = "open_gis.cli:main"

[tool.setuptools.packages.find]
include = ["open_gis*"]

[tool.setuptools.package-data]
open_gis = ["schemas/*.json"]

[tool.coverage.run]
branch = true
source = ["evals/assertions"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.coverage.json]
output = "assertion-coverage.json"

[tool.coverage.xml]
output = "assertion-coverage.xml"
