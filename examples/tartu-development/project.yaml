# =============================================================================
# Worked Open-GIS example matching the acceptance scenario in issue #4.
# "Find suitable development locations near main roads around Tartu with
# 25-minute walking access to municipal schools and kindergartens, and make
# an interactive map."
#
# Demonstrates: real authoritative source provenance + timestamps, explicit
# assumptions, data overrides (attribute correction + manually drawn geometry),
# multi-criteria spatial joins (roads + education walking catchments),
# deterministic processing, machine-readable validation, and semantic presentation.
#
# Schema reference: references/project-spec.md
# =============================================================================

schema: open-gis-project/v1

project:
  id: tartu-development-access
  title: Potential development areas near main roads and schools (Tartu)
  question: >-
    Identify potentially developable parcels meeting accessibility, education
    catchment (25-minute walking distance to city-owned kindergarten and school),
    and land-use criteria in Tartu, and show them on an interactive map with
    education POIs and catchment areas.
  created_at: 2026-08-25T08:15:03+03:00
  updated_at: 2026-08-25T10:00:00+03:00
  status: validated

interpretation:
  objective: >-
    Find cadastral parcels in the Tartu region satisfying stated land-use,
    minimum size (>= 2 ha), primary road accessibility (<= 2000 m), and
    pedestrian proximity to public education infrastructure (<= 25 min walk /
    2000 m to both kindergarten and school).
  assumptions:
    - id: A1
      statement: >-
        "Near a main road" is interpreted as <= 2000 m planar distance to a
        national primary (Põhimaantee) or secondary (Tugimaantee) road or planned
        connector.
      rationale: >-
        Standard arterial road access threshold for regional land-use development.
    - id: A2
      statement: >-
        Parcel area is measured in EPSG:3301 (L-EST97).
      rationale: Metric area calculation requires a projected national CRS.
    - id: A3
      statement: >-
        "25 minutes walking distance" to municipal schools and kindergartens is
        modeled as a planar catchment radius of <= 2000 m based on a standard
        walking speed of 4.8 km/h (80 m/min).
      rationale: >-
        Standard urban planning pedestrian catchment guideline for educational
        accessibility without requiring real-time transit schedule integration.

