overrides:
- id: OVERRIDE-001
  action: modify_attribute
  target:
    source: education_pois
    feature_id: kindergarten:C321B05A-5565-4AEB-B77B-FEE90B4C13FC
    feature_name: Ilmatsalu Lasteaed Lepatriinu
  change:
    field: active
    from: true
    to: false
  origin: scenario
  rationale: Service-resilience probe. This is the only municipal kindergarten covering the western candidate
    cluster within the 2 km proxy, so deactivating it measures how much of the Tier 1 result depends on
    one facility. It is a hypothetical scenario, NOT an assertion that the kindergarten is closed - the
    authoritative source still lists it as active and is never modified.
  evidence:
  - type: project_scenario
    value: Hypothetical single-facility outage authorized for this worked example; the source record remains
      active, and the pipeline verifies the asserted prior value (active = true) against the immutable
      source before applying the change.
  created_at: 2026-08-25 16:45:00+03:00
  created_by: scenario
- id: OVERRIDE-002
  action: add_feature
  layer: planned_roads
  properties:
    name: Hypothetical connector road
    status: scenario
  geometry_file:
    path: data/overrides/planned-road.geojson
  geometry_origin: scenario
  rationale: Demonstration-only hypothetical connector used to show how a scenario changes accessibility.
    It is not asserted to be an approved or planned road.
  evidence:
  - type: project_scenario
    value: Synthetic scenario authorized for this worked example; not baseline fact
  created_at: 2026-08-25 08:31:00+03:00
  created_by: scenario
processing:
  analysis_crs: EPSG:3301
  storage_crs: EPSG:4326
  steps:
  - id: load_parcels
    operation: read
    source: cadastral_parcels
    output: parcels_raw
  - id: filter_large_parcels
    operation: filter
    input: parcels_raw
    expression: area_m2 >= 20000 AND land_use IN ('MAATULUNDUSMAA', 'TOOTMISMAA', 'ARIMAA') AND municipality
      = 'Tartu linn'
    output: large_parcels
  - id: load_roads
    operation: read
    source: roads
    expression: road_class IN ('Põhimaantee', 'Tugimaantee')
    output: official_roads
  - id: load_scenario_road
    operation: load_scenario_feature
    override: OVERRIDE-002
    geometry_file: data/overrides/planned-road.geojson
    crs: EPSG:3301
    output: scenario_roads
  - id: combine_road_networks
    operation: union
    inputs:
    - official_roads
    - scenario_roads
    output: all_roads
  - id: load_education_pois
    operation: read
    source: education_pois
    output: source_education_pois
  - id: apply_education_override
    operation: apply_override
    input: source_education_pois
    override: OVERRIDE-001
    verify: asserted prior value must match the immutable source before the change is applied
    output: effective_education_pois, schools, kindergartens
  - id: calculate_education_catchments
    operation: buffer_union
    inputs:
    - schools
    - kindergartens
    distance_m: 2000
    buffer_segments: 64
    crs: EPSG:3301
    output: education_catchments
  - id: multi_criteria_accessibility
    operation: spatial_distance_join
    inputs:
    - large_parcels
    - all_roads
    - schools
    - kindergartens
    crs: EPSG:3301
    distance_basis: nearest parcel edge (see assumption A4)
    max_road_dist_m: 2000
    max_education_proxy_dist_m: 2000
    output: candidate_parcels
  - id: export_derived_datasets
    operation: export
    inputs:
    - candidate_parcels
    - education_catchments
    - effective_education_pois
    - official_roads
    formats:
    - GeoPackage
    - GeoParquet
    - GeoJSON
outputs:
  candidate_parcels_gpkg:
    path: data/derived/final-candidates.gpkg
    format: GeoPackage (EPSG:3301)
    generated_by: multi_criteria_accessibility
  candidate_parcels_parquet:
    path: data/derived/final-candidates.parquet
    format: GeoParquet (EPSG:3301)
    generated_by: multi_criteria_accessibility
  candidate_parcels_geojson:
    path: data/derived/final-candidates.json
    format: GeoJSON (EPSG:4326)
    generated_by: multi_criteria_accessibility
  education_catchments_geojson:
    path: data/derived/education_catchments.json
    format: GeoJSON (EPSG:4326)
    generated_by: calculate_education_catchments
  education_catchment_variants_geojson:
    path: data/derived/education_catchment_variants.json
    format: GeoJSON (EPSG:4326)
    generated_by: calculate_education_catchments
    role: exploratory_companion
    note: The same buffer rule at every radius the view's education-threshold control offers, for the
      effective and the override-free facility sets. Never the accepted result - education_catchments_geojson
      is.
  education_pois_geojson:
    path: data/derived/education_pois.json
    format: GeoJSON (EPSG:4326)
    generated_by: apply_education_override
  main_roads_geojson:
    path: data/derived/main_roads.json
    format: GeoJSON (EPSG:4326)
    generated_by: load_roads
validation:
  required:
  - geometry_valid
  - crs_known
  - no_duplicate_cadastral_id
  - row_count_gt_zero
  - no_null_cadastral_id
  - source_semantics_verified
  - source_result_complete
  - overrides_applied
  - manifest_graph_resolves
  - qgis_project_static_valid
  - manifest_report_parity
  - view_controls_match_pipeline
  domain_checks:
  - name: parcel_area_range
    expression: area_m2 >= 20000 AND area_m2 < 100000000
  - name: highway_distance_check
    expression: dist_main_road_m <= 2000
  - name: education_ownership_check
    expression: ownership = 'municipal' AND active = true
presentation:
  intent: analytical_workspace
  primary_view: map
  layout:
    type: map_with_sidebar
    sidebar:
      position: left
      width: large
      organization: tabs
      section_state: collapsible
      tabs:
      - id: analysis
        title: Analysis
        sections:
        - summary
        - metrics
        - criteria
        - assumptions
        - warnings
      - id: map
        title: Map
        sections:
        - scenario_controls
        - filters
        - layer_controls
        - basemap
      - id: edit
        title: Edit
        sections:
        - selected_feature
        - draw_geometry
        - draft_overrides
        - export_bundle
      - id: provenance
        title: Provenance
        sections:
        - provenance
        - overrides
        - validation
        - outputs
        - run_record
  controls:
    reconfigurable: true
    canonical_reset: true
    off_canonical_labelling: required
    filters:
    - id: min_area
      label: Minimum parcel area
      type: range
      field: area_m2
      unit: m2
      canonical: 20000
      step: 5000
    - id: max_road_distance
      label: Max distance to highway
      type: range
      field: dist_main_road_m
      unit: m
      canonical: 2000
      step: 100
      bounded_by_run: true
      note: The run measured only parcels within the canonical distance, so this control may tighten the
        rule but never widen it.
    - id: education_threshold
      label: Education proximity threshold
      type: choice
      fields:
      - dist_school_m
      - dist_kg_m
      unit: m
      canonical: 2000
      options:
      - 1000
      - 1500
      - 2000
      - 2500
      - 3000
      redraws: education_catchment_variants_geojson
      note: Re-applies the tier rule to distances already measured in EPSG:3301 and swaps in the matching
        precomputed buffer.
    - id: land_use
      label: Land use
      type: multi_select
      field: land_use
      canonical:
      - ARIMAA
      - MAATULUNDUSMAA
      - TOOTMISMAA
    scenarios:
    - id: scenario_road
      label: Hypothetical connector road
      override: OVERRIDE-002
      canonical: true
      baseline_fields:
      - dist_official_road_m
    - id: scenario_outage
      label: Facility outage
      override: OVERRIDE-001
      canonical: true
      baseline_fields:
      - dist_school_baseline_m
      - dist_kg_baseline_m
  map:
    engine_preference: maplibre
    interaction:
      feature_select: true
      hover_tooltip: true
      zoom_to_selection: true
    layer_groups:
    - id: candidates_tier1
      title: Prime Candidates (Road + School + Kindergarten within 2 km proxy)
      default_open: true
    - id: candidates_tier2
      title: Secondary Candidates (Road <= 2km + School or KG within 2 km proxy)
      default_open: true
    - id: candidates_highway
      title: Highway Only Candidates (> 2 km proxy to School/KG)
      default_open: false
    - id: catchments
      title: Education Accessibility Proxies (2,000 m Straight-line Buffer)
      default_open: true
    - id: education_pois
      title: Educational POIs (Schools & Kindergartens)
      default_open: true
    - id: user_overrides
      title: Project Overrides (Scenario Road + Facility Outage)
      default_open: true
    - id: infrastructure
      title: National Highway Network (ETAK)
      default_open: true
  legend:
    visible: true
    mode: semantic
  provenance_ui:
    feature_source_on_click: true
    show_source_timestamp: true
    show_override_badge: true
    show_assumptions: true
  editing:
    allow_draw_geometry: true
    allow_attribute_override: true
    allow_hide_source_feature: true
    allow_add_annotation: true
    draft_persistence: local_storage
    export_format: open-gis-override-bundle/v1
    canonical_application: pipeline_required
    targets:
      candidates:
        label: Cadastral parcel
        source: cadastral_parcels
        id_field: cadastral_id
        label_field: address
        fields:
        - view_field: land_use
          source_field: siht1
          label: Land use
          type: choice
          options:
          - ARIMAA
          - MAATULUNDUSMAA
          - TOOTMISMAA
        - view_field: area_m2
          source_field: pindala
          label: Official area (m²)
          type: number
        - view_field: address
          source_field: l_aadress
          label: Address
          type: text
        - view_field: settlement
          source_field: ay_nimi
          label: Settlement
          type: text
      pois:
        label: Education facility
        source: education_pois
        id_field: source_id
        label_field: name
        fields:
        - view_field: active
          source_field: active
          source_value_field: active_source
          label: Active
          type: boolean
        - view_field: name
          source_field: name
          label: Name
          type: text
        - view_field: address
          source_field: address
          label: Address
          type: text
        - view_field: ownership
          source_field: ownership
          label: Ownership
          type: text
warnings:
- id: SCENARIO-001
  severity: high
  layer: education_pois, planned_roads
  issue: scenario_in_effect
  statement: The headline numbers include two hypothetical overrides — OVERRIDE-001 (Ilmatsalu kindergarten
    treated as not operating) and OVERRIDE-002 (connector road that does not exist). They are not a description
    of present-day conditions.
  mitigation: Remove both overrides from project.yaml and rerun for the authoritative baseline; every
    scenario feature is styled distinctly and badged in the map view.
- id: DATA-001
  severity: medium
  layer: education_pois
  issue: completeness_unknown
  statement: The municipal education ArcGIS items do not publish explicit license text.
  mitigation: Confirm reuse terms with Tartu City Government before redistribution.
- id: METHOD-001
  severity: medium
  layer: education_catchments
  issue: euclidean_proxy
  statement: The 2,000 m buffers are straight-line screening proxies, not pedestrian-network isochrones.
  mitigation: Use a routable pedestrian network with crossings and barriers before consequential decisions.
runtime:
  implementation:
    preferred_engine: duckdb-spatial
    pipeline: pipeline.py
  environment:
    python: '3.12'
    duckdb: 1.5.5
    gdal: DuckDB spatial extension
    proj: pyproj 3.7.2
    qgis: 3.44.3 Docker opt-in; deterministic XML builder by default
