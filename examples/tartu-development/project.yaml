schema: open-gis-project/v1
project:
  id: tartu-development-access
  title: Potential development areas near main roads and schools (Tartu)
  question: Identify potentially developable parcels meeting accessibility, education catchment (25-minute
    walking distance to city-owned kindergarten and school), and land-use criteria in Tartu, and show
    them on an interactive map with education POIs and catchment areas.
  created_at: 2026-08-25 08:15:03+03:00
  updated_at: '2026-08-25T20:28:44.708845+00:00'
  status: warning
interpretation:
  objective: "Find cadastral parcels in the Tartu region satisfying stated land-use, minimum size (>=\
    \ 2 ha), primary road accessibility (<= 2000 m), and\n    a documented 2,000 m straight-line accessibility\
    \ proxy to both verified\n    municipal kindergarten and school locations."
  assumptions:
  - id: A1
    statement: '"Near a main road" is interpreted as <= 2000 m planar distance to a national primary (Põhimaantee)
      or secondary (Tugimaantee) road or hypothetical scenario connector.'
    rationale: Standard arterial road access threshold for regional land-use development.
  - id: A2
    statement: Parcel area is measured in EPSG:3301 (L-EST97).
    rationale: Metric area calculation requires a projected national CRS.
  - id: A3
    statement: The requested "25 minutes walking access" is represented only as a 2,000 m planar straight-line
      proxy based on 4.8 km/h (80 m/min); it is not a pedestrian-network isochrone.
    rationale: A transparent screening proxy for this worked example. Consequential planning requires
      a routable pedestrian network and barrier-aware isochrones. Derived columns are named straightline_time_school_min
      / straightline_time_kg_min so no consumer reads them as walk times.
  - id: A4
    statement: All distance thresholds are measured from the nearest parcel EDGE (ST_Distance on the polygon),
      not from its centroid, so a parcel qualifies when any part of it is within range.
    rationale: Screening for developable land asks whether the plot has access, not whether its centre
      does; on 10-100 ha rural parcels the two rules differ by kilometres. A centroid rule would be the
      right choice for evaluating a specific building site.
