# =============================================================================
# Worked Open-GIS example matching the acceptance scenario in issue #4.
# "Find suitable development locations near main roads around Tartu and make
# an interactive map."
#
# Demonstrates: source provenance + timestamps, explicit assumptions, data
# overrides (attribute correction + manually drawn geometry), deterministic
# processing steps, CRS choices, machine-readable validation, semantic
# presentation, and a pending data-quality warning.
#
# Schema reference: references/project-spec.md
# =============================================================================

schema: open-gis-project/v1

project:
  id: tartu-development-access
  title: Potential development areas near main roads (Tartu)
  question: >-
    Identify potentially developable parcels meeting the stated accessibility
    and land-use criteria around Tartu, and show them on an interactive map.
  created_at: 2026-08-25T08:15:03+03:00
  updated_at: 2026-08-25T08:42:11+03:00
  status: validated

interpretation:
  objective: >-
    Find cadastral parcels in the Tartu region satisfying the stated land-use,
    size and transport-access constraints.
  assumptions:
    - id: A1
      statement: >-
        "Near a main road" is interpreted as <= 2000 m planar distance,
        independent of the road network.
      rationale: >-
        The user did not specify travel time or road-network accessibility, so
        a simple planar distance was used and recorded as an assumption.
    - id: A2
      statement: >-
        Parcel area is measured in EPSG:3301 (L-EST97).
      rationale: Metric area calculation requires a projected national CRS.

sources:
  cadastral_parcels:
    role: authoritative_input
    provider: Maa- ja Ruumiamet
    dataset: cadastral parcels (cadastral units / maaüksus)
    source_url: "https://s3.pilw.io/rp-kemit-kataster/ANDMED/Tartu_maakond_KATASTER_GPKG.zip"
    portal_page: "https://geoportaal.maaruum.ee/eng/spatial-data/cadastral-data-p310.html"
    access:
      method: http(s) bulk download
      downloaded_at: 2026-08-25T00:26:19Z
      retrieved_at: 2026-08-25T00:26:19Z
      file:
        archive_name: "Tartu_maakond_KATASTER_GPKG.zip"
        extracted_file: "Tartu_maakond_KATASTER_GPKG.gpkg"
        table_name: "Tartu maakond"
        format: "GeoPackage (GPKG/SQLite)"
        size_bytes: 55746560
        row_count: 79056
        column_count: 32
      request_spec: >-
        Direct county GPKG zip download from Maa- ja Ruumiamet S3 storage:
        https://s3.pilw.io/rp-kemit-kataster/ANDMED/Tartu_maakond_KATASTER_GPKG.zip
        extracted to data/source/Tartu_maakond_KATASTER_GPKG.gpkg containing
        layer 'Tartu maakond' (79,056 parcels in EPSG:3301).
    version:
      published_at: 2026-08-25
      identifier: "Tartu_maakond_KATASTER_GPKG (daily snapshot 2026-08-25)"
      etag: "330f453002a8a3923a022e6bfdb11077-4"
    selection:
      municipality: "Tartu linn"
      filter: "pindala >= 20000 AND siht1 IN ('MAATULUNDUSMAA', 'TOOTMISMAA', 'ARIMAA')"
    license:
      name: Estonian open data (CC BY 4.0)
      url: "https://geoportaal.maaruum.ee/eng"
    schema:
      crs: "EPSG:3301 (L-EST97)"
      key: "tunnus"
      area_field: "pindala"
      land_use_field: "siht1"
      municipality_field: "ov_nimi"
      columns:
        - id
        - geom
        - fid
        - tunnus
        - hkood
        - mk_nimi
        - ov_nimi
        - ay_nimi
        - l_aadress
        - registr
        - muudet
        - siht1
        - siht2
        - siht3
        - so_prts1
        - so_prts2
        - so_prts3
        - pindala
        - haritav
        - rohumaa
        - mets
        - ouemaa
        - muumaa
        - kinnistu
        - muutpohjus
        - omvorm
        - maks_hind
        - marked
        - ads_oid
        - adob_id
        - oiguslik_alus
        - eksport
    rationale: >-
      Authoritative cadastral geometry and land-use attributes from
      Maa- ja Ruumiamet. Downloaded as the official Tartu county GeoPackage
      snapshot containing all 79,056 parcels with legal land-use designations
      (siht1) and official area measurements (pindala in m²).

  roads:
    role: authoritative_input
    provider: Maa- ja Ruumiamet (ETAK)
    dataset: national road network centreline (ETAK teed)
    source_url: "https://gsavalik.envir.ee/geoserver/etak/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=etak:e_501_tee_j&srsName=EPSG:3301&outputFormat=application/json&bbox=640000,6455000,685000,6500000,EPSG:3301&count=5000"
    portal_page: "https://geoportaal.maaruum.ee/est/ruumiandmed/eesti-topograafia-andmekogu/laadi-etak-andmed-alla-p609.html"
    access:
      method: WFS 2.0.0 (GetFeature)
      downloaded_at: 2026-08-25T08:19:30+03:00
      retrieved_at: 2026-08-25T08:19:30+03:00
      file:
        name: "etak_roads.geojson"
        layer_name: "etak:e_501_tee_j"
        format: "GeoJSON (FeatureCollection, EPSG:3301)"
        row_count: 2000
        column_count: 10
      request_spec: >-
        WFS GetFeature request on Environment Agency GeoServer for
        etak:e_501_tee_j in Tartu region bbox [640000,6455000,685000,6500000]
        in EPSG:3301, filtered for main roads (Põhimaantee and Tugimaantee).
    version:
      published_at: 2026-08-20
      identifier: "etak:e_501_tee_j (ETAK roads GeoServer snapshot)"
    selection:
      bbox: [640000, 6455000, 685000, 6500000]
      filter: "tyyp_tekst IN ('Põhimaantee', 'Tugimaantee')"
    license:
      name: Estonian open data (CC BY 4.0)
      url: "https://geoportaal.maaruum.ee/eng"
    schema:
      crs: "EPSG:3301 (L-EST97)"
      key: "etak_id"
      class_field: "tyyp_tekst"
      name_field: "nimetus"
      columns:
        - etak_id
        - kood
        - kood_tekst
        - nimetus
        - tee
        - tyyp
        - tyyp_tekst
        - tahtsus
        - tahtsus_tekst
        - geometry
    rationale: >-
      Official national road network geometry from ETAK, queried live via
      WFS. Filtered to primary (Põhimaantee) and secondary (Tugimaantee)
      national highways around Tartu.

  pois:
    role: context
    provider: OpenStreetMap via Geofabrik
    dataset: POIs in Tartu extract
    source_url: "https://download.geofabrik.de/europe/estonia-latest.osm.pbf"
    access:
      method: http(s)
      downloaded_at: 2026-08-25T08:22:40+03:00
      retrieved_at: 2026-08-25T08:22:40+03:00
      file:
        name: "estonia-latest.osm.pbf"
        table_name: "points"
        format: "OSM PBF (compressed)"
    version:
      published_at: 2026-08-24
      identifier: "estonia-latest.osm.pbf 2026-08-24"
    selection:
      bbox: [25.4, 58.3, 26.9, 58.9]
    license:
      name: ODbL 1.0
      url: "https://www.openstreetmap.org/copyright"
    schema:
      columns: [osm_id, name, amenity, shop, status, geometry]
    rationale: >-
      Used as lightweight context for proximity; not authoritative for
      completeness. See warnings.DATA-001.

overrides:
  - id: OVERRIDE-001
    action: modify_attribute
    target:
      source: pois
      feature_id: "12345"
    change:
      field: status
      from: active
      to: closed
    rationale: >-
      The source dataset is stale; this facility has permanently closed.
    evidence:
      - type: url
        value: "https://example.org/closure-notice"
    created_at: 2026-08-25T08:26:00+03:00
    created_by: user

  - id: OVERRIDE-002
    action: add_feature
    layer: planned_roads
    properties:
      name: Proposed connector road
      status: planned
    geometry_file:
      path: data/overrides/planned-road.geojson
    geometry_origin: user_drawn
    rationale: >-
      The planned connector road does not yet exist in any machine-readable
      geospatial dataset but is material to the scenario.
    evidence:
      - type: planning_document
        title: "Tartu city master plan"
        page: 37
    created_at: 2026-08-25T08:31:00+03:00
    created_by: user

processing:
  analysis_crs: EPSG:3301
  storage_crs: EPSG:4326
  steps:
    - id: load_parcels
      operation: read
      source: cadastral_parcels
      output: parcels_raw
    - id: validate_parcels
      operation: validate_geometry
      input: parcels_raw
      output: parcels_valid
    - id: calculate_area
      operation: calculate_area
      input: parcels_valid
      crs: EPSG:3301
      output_field: area_m2
    - id: select_large_parcels
      operation: filter
      input: calculate_area
      expression: "area_m2 >= 20000"
      output: large_parcels
    - id: road_distance
      operation: distance_filter
      input: large_parcels
      target: roads
      max_distance_m: 2000
      output: candidate_parcels
    - id: apply_overrides
      operation: merge_overrides
      input: candidate_parcels
      overrides:
        - OVERRIDE-001
        - OVERRIDE-002
      output: final_candidates

outputs:
  candidate_parcels:
    path: data/derived/candidate-parcels.parquet
    format: GeoParquet
    generated_by: road_distance
  final_candidates:
    path: data/derived/final-candidates.parquet
    format: GeoParquet
    generated_by: apply_overrides

validation:
  required:
    - geometry_valid
    - crs_known
    - no_duplicate: cadastral_id
    - row_count_gt: 0
    - no_null: cadastral_id
  domain_checks:
    - name: parcel_area_range
      expression: "area_m2 > 0 AND area_m2 < 100000000"

presentation:
  intent: analytical_workspace
  primary_view: map
  layout:
    type: map_with_sidebar
    sidebar:
      position: left
      width: medium
      sections:
        - summary
        - filters
        - layer_controls
        - provenance
  map:
    engine_preference: maplibre
    interaction:
      feature_select: true
      hover_tooltip: true
      zoom_to_selection: true
    layer_groups:
      - id: context
        title: Context
        default_open: false
      - id: inputs
        title: Source data
        default_open: false
      - id: analysis
        title: Analysis
        default_open: true
      - id: user_overrides
        title: Manual additions and corrections
        default_open: true
    layers:
      - source: final_candidates
        group: analysis
        semantic_role: primary_result
        geometry: polygon
        style:
          visual_priority: primary
          opacity: 0.65
      - source: planned_roads
        group: user_overrides
        semantic_role: planned
        geometry: line
        style:
          color: dashed
  legend:
    visible: true
    mode: semantic
  provenance_ui:
    feature_source_on_click: true
    show_source_timestamp: true
    show_override_badge: true
    show_assumptions: true
  editing:
    allow_draw_geometry: true
    allow_attribute_override: true
    allow_hide_source_feature: true
    allow_add_annotation: true

warnings:
  - id: DATA-001
    severity: medium
    layer: pois
    issue: completeness_unknown
    statement: >-
      This OSM POI dataset may omit recently opened or closed locations.
    mitigation: >-
      Verify material POIs against local or authoritative sources before using
      the result for consequential decisions.

runtime:
  implementation:
    preferred_engine: duckdb-spatial
    pipeline: pipeline.py
  environment:
    python: "3.13"
    duckdb: "1.2.x"
    gdal: "3.9.x"
    proj: "9.4.x"

