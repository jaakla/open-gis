overrides:
  - id: OVERRIDE-001
    action: modify_attribute
    target:
      source: education_pois
      feature_id: "12345"
    change:
      field: status
      from: active
      to: closed
    rationale: >-
      The source dataset contains a closed facility; marked as inactive.
    evidence:
      - type: url
        value: "https://example.org/closure-notice"
    created_at: 2026-08-25T08:26:00+03:00
    created_by: user

  - id: OVERRIDE-002
    action: add_feature
    layer: planned_roads
    properties:
      name: Proposed connector road
      status: planned
    geometry_file:
      path: data/overrides/planned-road.geojson
    geometry_origin: user_drawn
    rationale: >-
      The planned connector road does not yet exist in official machine-readable
      geospatial datasets but connects Tähtvere development zone to the main highway network.
    evidence:
      - type: planning_document
        title: "Tartu city master plan"
        page: 37
    created_at: 2026-08-25T08:31:00+03:00
    created_by: user

processing:
  analysis_crs: EPSG:3301
  storage_crs: EPSG:4326
  steps:
    - id: load_parcels
      operation: read
      source: cadastral_parcels
      output: parcels_raw
    - id: filter_large_parcels
      operation: filter
      input: parcels_raw
      expression: "area_m2 >= 20000 AND land_use IN ('MAATULUNDUSMAA', 'TOOTMISMAA', 'ARIMAA') AND municipality = 'Tartu linn'"
      output: large_parcels
    - id: load_roads
      operation: read
      source: roads
      expression: "road_class IN ('Põhimaantee', 'Tugimaantee')"
      output: base_roads
    - id: apply_road_override
      operation: merge_feature
      input: base_roads
      override: OVERRIDE-002
      output: all_roads
    - id: load_education_pois
      operation: read
      source: education_pois
      output: schools, kindergartens
    - id: calculate_education_catchments
      operation: buffer_union
      inputs: [schools, kindergartens]
      distance_m: 2000
      output: education_catchments
    - id: multi_criteria_accessibility
      operation: spatial_distance_join
      inputs: [large_parcels, all_roads, schools, kindergartens]
      max_road_dist_m: 2000
      max_education_walk_dist_m: 2000
      output: candidate_parcels
    - id: export_derived_datasets
      operation: export
      inputs: [candidate_parcels, education_catchments, education_pois, all_roads]
      formats: [GeoPackage, GeoParquet, GeoJSON]

outputs:
  candidate_parcels_gpkg:
    path: data/derived/final-candidates.gpkg
    format: GeoPackage (EPSG:3301)
    generated_by: multi_criteria_accessibility
  candidate_parcels_parquet:
    path: data/derived/final-candidates.parquet
    format: GeoParquet (EPSG:3301)
    generated_by: multi_criteria_accessibility
  candidate_parcels_geojson:
    path: data/derived/final-candidates.json
    format: GeoJSON (EPSG:4326)
    generated_by: multi_criteria_accessibility
  education_catchments_geojson:
    path: data/derived/education_catchments.json
    format: GeoJSON (EPSG:4326)
    generated_by: calculate_education_catchments
  education_pois_geojson:
    path: data/derived/education_pois.json
    format: GeoJSON (EPSG:4326)
    generated_by: load_education_pois
  main_roads_geojson:
    path: data/derived/main_roads.json
    format: GeoJSON (EPSG:4326)
    generated_by: apply_road_override

validation:
  required:
    - geometry_valid
    - crs_known
    - no_duplicate: cadastral_id
    - row_count_gt: 0
    - no_null: cadastral_id
  domain_checks:
    - name: parcel_area_range
      expression: "area_m2 >= 20000 AND area_m2 < 100000000"
    - name: highway_distance_check
      expression: "dist_main_road_m <= 2000"

presentation:
  intent: analytical_workspace
  primary_view: map
  layout:
    type: map_with_sidebar
    sidebar:
      position: left
      width: large
      sections:
        - summary
        - metrics
        - filters
        - layer_controls
        - assumptions
        - overrides
        - provenance
        - validation
  map:
    engine_preference: maplibre
    interaction:
      feature_select: true
      hover_tooltip: true
      zoom_to_selection: true
    layer_groups:
      - id: candidates_tier1
        title: "Prime Candidates (Road + School + Kindergarten <= 25min)"
        default_open: true
      - id: candidates_tier2
        title: "Secondary Candidates (Road <= 2km + School or KG <= 25min)"
        default_open: true
      - id: candidates_highway
        title: "Highway Only Candidates (> 25min walk to School/KG)"
        default_open: false
      - id: catchments
        title: "25-min Walking Catchments (2000m Buffer)"
        default_open: true
      - id: education_pois
        title: "Educational POIs (Schools & Kindergartens)"
        default_open: true
      - id: user_overrides
        title: "Manual Overrides (Planned Road)"
        default_open: true
      - id: infrastructure
        title: "National Highway Network (ETAK)"
        default_open: true
  legend:
    visible: true
    mode: semantic
  provenance_ui:
    feature_source_on_click: true
    show_source_timestamp: true
    show_override_badge: true
    show_assumptions: true

warnings:
  - id: DATA-001
    severity: medium
    layer: education_pois
    issue: completeness_unknown
    statement: >-
      OSM POI datasets may omit private daycare centers or recent facility renamings.
    mitigation: >-
      Verify material POIs against official municipal education registry before
      binding zoning decisions.

